<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>KyPhone</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
<div class="phone">

  <!-- 잠금화면 -->
  <section id="lockScreen" class="screen lock-screen">
    <div class="lock-overlay"></div>

    <div class="lock-content">
      <div id="lockDate">10월 27일 화요일</div>
      <div id="lockTime">4:41</div>
    </div>

    <div class="lock-bottom">
      <button>☼</button>
      <button>●</button>
    </div>

    <div class="swipe-area">
      <div>⌃</div>
      위로 쓸어올려 잠금 해제
    </div>
  </section>


  <!-- 홈화면 -->
  <section id="homeScreen" class="screen home-screen hidden">

    <div class="status-bar">
      <span id="homeTime">4:41</span>
      <div>●●●　▰　▰</div>
    </div>

    <div class="app-grid">

      <button class="app" onclick="openApp('instagram')">
        <img src="./instagram.jpg">
        <span>Instagram</span>
      </button>

      <button class="app" onclick="openApp('photos')">
        <img src="./photos.jpg">
        <span>사진</span>
      </button>

      <button class="app" onclick="openApp('messages')">
        <img src="./messages.jpg">
        <span>메시지</span>
      </button>

      <button class="app" onclick="openApp('kakao')">
        <img src="./kakao.jpg">
        <span>카카오톡</span>
      </button>

      <button class="app" onclick="openApp('phone')">
        <img src="./phone.jpg">
        <span>전화</span>
      </button>

    </div>


    <!-- 하단 독 -->
    <div class="dock">

      <button onclick="openApp('phone')">
        <img src="./phone.jpg">
      </button>

      <button onclick="openApp('photos')">
        <img src="./photos.jpg">
      </button>

      <button onclick="openApp('messages')">
        <img src="./messages.jpg">
      </button>

    </div>

    <div class="home-bar"></div>
  </section>


  <!-- 앱 화면 -->
  <section id="appScreen" class="screen app-screen hidden">

    <header class="app-header">
      <button onclick="closeApp()">‹</button>
      <strong id="appTitle">앱</strong>
    </header>

    <main id="appContent"></main>

    <div class="home-bar dark"></div>
  </section>

</div>

<script src="./app.js"></script>
</body>
</html>
